name: CGV Watch

on:
  schedule:
    - cron: "0 */4 * * *"   # 4시간마다 새 작업 시작 (작업 하나가 3시간 45분간 계속 감시)
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: cgv-watch
  cancel-in-progress: true

env:
  # ▼▼▼ 여기만 수정하면 됩니다 ▼▼▼
  MOVIE_KEYWORD: "스파이더맨"                              # 감시할 영화 (공백·더빙 등 변형도 자동으로 잡힘)
  THEATER_URL: "https://cgv.co.kr/cnm/movieBook/cinema"    # CGV 예매 페이지
  THEATER_NAME: "용산아이파크몰"                            # 페이지에서 선택할 극장 이름
  TARGET_WEEKDAYS: "금,토,일"                              # 감시할 요일 (이번 주·다음 주)
  CHECK_EVERY_SEC: "30"                                    # 확인 간격(초)
  CHAT_ID: "7731303031"                                    # 텔레그램 chat ID
  RUN_MINUTES: "225"
  # ▲▲▲ 여기까지 ▲▲▲

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Start state saver
        run: |
          git config user.name "cgv-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          nohup bash -c '
            for i in $(seq 1 500); do
              sleep 30
              if [ -f seen.json ]; then
                git add seen.json 2>/dev/null || true
                if ! git diff --cached --quiet 2>/dev/null; then
                  git commit -q -m "seen 업데이트" 2>/dev/null || true
                  git pull --rebase -q 2>/dev/null || true
                  git push -q 2>/dev/null || true
                fi
              fi
            done
          ' > /dev/null 2>&1 &
          echo "상태 자동 저장 시작 (30초마다)"

      - name: Watch CGV
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python -u check_cgv.py

      - name: Save state
        if: always()
        run: |
          git add seen.json || true
          git diff --cached --quiet || (git commit -q -m "seen 업데이트" && git pull --rebase -q && git push -q) || true
