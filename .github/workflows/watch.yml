name: CGV Watch

on:
  schedule:
    - cron: "0 */4 * * *"   # 4시간마다 새 작업 시작 (작업 하나가 3시간 45분간 계속 감시)
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: cgv-watch
  cancel-in-progress: true

env:
  # ▼▼▼ 여기만 수정하면 됩니다 ▼▼▼
  MOVIE_KEYWORD: "아바타"                                  # 감시할 영화 제목 (공백·더빙 등 변형도 자동으로 잡힘)
  THEATER_URL: "https://cgv.co.kr/reserve/show-times/"     # CGV에서 극장 선택 후 복사한 주소
  THEATER_NAME: "용산아이파크몰"                            # 주소에 극장 정보가 없을 때 페이지에서 눌러볼 극장 이름
  CHECK_EVERY_SEC: "30"                                    # 확인 간격(초) — 너무 줄이면 차단 위험
  CHAT_ID: "7731303031"                                    # 텔레그램 chat ID
  RUN_MINUTES: "225"
  # ▲▲▲ 여기까지 ▲▲▲

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 250
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Watch CGV
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python check_cgv.py

      - name: Save state
        if: always()
        run: |
          git config user.name "cgv-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json || true
          git diff --cached --quiet || (git commit -m "seen 업데이트" && git push)
